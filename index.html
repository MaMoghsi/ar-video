<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport"
          content="width=device-width,height=device-height,initial-scale=1.0,viewport-fit=cover">


    <script src="js/aframe.min.js"></script>
    <script src="js/mindar-image-aframe.prod.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        a-scene {
            position: fixed;
            inset: 0;
            width: 100vw !important;
            height: 100vh !important;
        }
    </style>
</head>

<body>

<a-scene
        mindar-image="imageTargetSrc: assets/targets/targets.mind;"
        color-space="sRGB"
        embedded
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

    <a-assets>

    </a-assets>

    <a-camera
            position="0 0 0"
            look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

        <a-box
                position="0 0 0"
                depth="0.2"
                height="0.5"
                width="0.5"
                color="red">
        </a-box>

    </a-entity>

</a-scene>

</body>

</html>
