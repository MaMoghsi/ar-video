<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1.0,viewport-fit=cover">

    <script src="js/aframe.min.js"></script>
    <script src="js/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="style.css">

</head>
<body>
<a-scene
        mindar-image="imageTargetSrc: assets/targets/targets.mind;"
        color-space="sRGB"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

    <a-assets id="assets"></a-assets>

    <a-camera
            position="0 0 0"
            look-controls="enabled:false">
    </a-camera>

</a-scene>
<div id="debug-panel">

    <div class="debug-row">

        <span>Scale</span>

        <button id="scale-minus">-</button>

        <span id="scale-value">1</span>

        <button id="scale-plus">+</button>

    </div>

    <div class="debug-row">

        <span>Pos X</span>

        <button id="px-minus">-</button>

        <span id="px-value">0</span>

        <button id="px-plus">+</button>

    </div>

    <div class="debug-row">

        <span>Pos Y</span>

        <button id="py-minus">-</button>

        <span id="py-value">0</span>

        <button id="py-plus">+</button>

    </div>

    <div class="debug-row">

        <span>Pos Z</span>

        <button id="pz-minus">-</button>

        <span id="pz-value">0</span>

        <button id="pz-plus">+</button>

    </div>

    <button id="copy-config">

        Copy Config

    </button>

</div>


<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
